name: Repository Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify tracked content and safe configuration
        run: python3 scripts/validate_repository.py
      - name: Verify safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Whitespace
        run: git show --format= --check HEAD
